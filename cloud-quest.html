<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Quest | Grade 7 Science</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#15344e;background:#eaf5ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#154d83,#49a8d9);color:white;padding:35px 18px;text-align:center}h1{margin:0;font-size:clamp(2rem,6vw,3.3rem)}header p{opacity:.95}main{max-width:760px;margin:25px auto;padding:0 16px}.panel{background:white;border-radius:22px;padding:25px;box-shadow:0 8px 30px #14436b1b}button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:13px 18px;font-weight:650}.primary{background:#1663a5;color:white}.primary:disabled{opacity:.45;cursor:not-allowed}.choice{display:block;text-align:left;width:100%;margin:10px 0;background:#eff6fc;border:2px solid transparent}.choice:hover:not(:disabled){background:#e1effc}.choice.selected{border-color:#1877c9;background:#dcefff}.choice.correct{background:#d7f6e5;border-color:#188a55}.choice.wrong{background:#ffe0e0;border-color:#d04b4b}.choice:disabled{cursor:default}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700}.bar{height:10px;background:#d9eaf7;border-radius:30px;overflow:hidden;margin:16px 0 24px}.fill{height:100%;background:#2a9fd6;transition:width .3s}.feedback{padding:14px;border-radius:12px;background:#eaf4fd;margin:14px 0;line-height:1.5}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.muted{color:#577087}.hidden{display:none}#result{text-align:center}#result strong{font-size:3rem}footer{text-align:center;padding:20px;color:#60788b}#question{font-size:1.35rem;line-height:1.4}</style></head><body><header><h1>☁️ Cloud Quest</h1><p>Grade 7 Science • Cloud formation, names & types</p></header><main><section class="panel" id="intro"><h2>Ready to become a cloud expert?</h2><p>15 questions • Instant explanations • Score at the end</p><p>Learn how clouds form and identify cirrus, stratus, cumulus, cumulonimbus, and more.</p><button class="primary" onclick="start()">Start quiz →</button></section><section class="panel hidden" id="quiz"><div class="meta"><span id="counter"></span><span id="score"></span></div><div class="bar"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div id="answers"></div><div class="feedback hidden" id="feedback" aria-live="polite"></div><div class="actions"><button onclick="restart()">↺ Restart</button><button class="primary" id="next" onclick="next()" disabled>Check answer</button></div></section><section class="panel hidden" id="result"><h2>Cloud Quest Complete! 🎉</h2><strong id="finalScore"></strong><p id="message"></p><button class="primary" onclick="restart()">Try again</button></section></main><footer>Keep looking up! ☁️</footer><script>const questions=[["What causes water vapor to condense into cloud droplets?",["Air warms up","Air cools to its dew point","Wind stops","Sunlight disappears"],1,"Cooling air reaches saturation, allowing water vapor to condense onto tiny particles."],["What is the main process that makes rising moist air cool?",["Expansion as air pressure decreases","Compression by higher pressure","Absorbing heat from soil","Increasing humidity alone"],0,"Rising air expands in lower pressure and cools."],["Which cloud type is thin, wispy, and high in the sky?",["Stratus","Cumulus","Cirrus","Nimbostratus"],2,"Cirrus clouds are high and made mainly of ice crystals."],["Which cloud type looks like a low, gray blanket?",["Stratus","Cirrocumulus","Cumulonimbus","Cirrus"],0,"Stratus clouds form low, fairly uniform layers."],["Which cloud type often looks like fluffy cotton with flat bases?",["Altostratus","Cumulus","Cirrostratus","Nimbostratus"],1,"Fair-weather cumulus clouds often have puffy tops and flatter bases."],["Which cloud is most associated with thunderstorms?",["Cirrus","Altocumulus","Cumulonimbus","Stratus"],2,"Cumulonimbus clouds grow vertically and can produce lightning and heavy rain."],["What does the prefix 'alto-' usually indicate in cloud names?",["Low-level clouds","Middle-level clouds","Thunderstorm clouds","Ice-only clouds"],1,"Alto- typically indicates clouds at middle altitudes."],["What does 'nimbus' or 'nimbo-' suggest in a cloud name?",["Rain or precipitation","High altitude","Clear skies","Strong sunshine"],0,"Nimbus relates to precipitation-producing clouds."],["Which cloud commonly brings widespread steady rain or snow?",["Nimbostratus","Cirrocumulus","Fair-weather cumulus","Cirrus"],0,"Nimbostratus forms thick layered clouds associated with sustained precipitation."],["Why do cloud droplets usually form around dust, salt, or smoke particles?",["They supply oxygen","They act as condensation nuclei","They stop evaporation entirely","They create gravity"],1,"Tiny airborne particles provide surfaces where vapor can condense."],["Which high cloud can create a halo around the Sun or Moon?",["Stratocumulus","Cirrostratus","Cumulus","Altocumulus"],1,"Cirrostratus ice crystals can refract light to produce halos."],["What is fog?",["A cloud touching the ground","A cloud above 6 km","Frozen rain","A type of wind"],0,"Fog is essentially a cloud at ground level."],["Which describes stratocumulus clouds?",["Thin wisps high above","Low, lumpy cloud layers","Very tall thunderheads","A clear blue sky"],1,"Stratocumulus are low clouds arranged in patches or layers of rounded masses."],["When warm moist air is forced up a mountain, clouds can form because the air…",["Expands and cools","Gets denser and heats up","Loses all its water instantly","Stops moving"],0,"Orographic lifting makes air rise, expand, and cool toward saturation."],["What are most high-altitude cirrus clouds made of?",["Large raindrops","Ice crystals","Sand grains","Only oxygen"],1,"Cirrus form in cold upper air and consist mainly of ice crystals."]];let order=[],index=0,points=0,selected=null,checked=false;const el=id=>document.getElementById(id);function show(id){['intro','quiz','result'].forEach(x=>el(x).classList.toggle('hidden',x!==id))}function start(){order=questions.map((_,i)=>i).sort(()=>Math.random()-.5);index=0;points=0;show('quiz');render()}function restart(){start()}function render(){selected=null;checked=false;const q=questions[order[index]];el('counter').textContent='Question '+(index+1)+' of '+order.length;el('score').textContent='Score: '+points;el('fill').style.width=(index/order.length*100)+'%';el('question').textContent=q[0];el('feedback').classList.add('hidden');el('answers').innerHTML='';q[1].forEach((a,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+a;b.onclick=()=>{if(checked)return;selected=i;document.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===i));el('next').disabled=false};el('answers').appendChild(b)});el('next').textContent='Check answer';el('next').disabled=true}function next(){if(!checked){if(selected===null)return;checked=true;const q=questions[order[index]];if(selected===q[2])points++;document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;b.classList.remove('selected');if(i===q[2])b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});el('feedback').textContent=(selected===q[2]?'✅ You got it! ':'💡 Not quite. ')+q[3];el('feedback').classList.remove('hidden');el('score').textContent='Score: '+points;el('next').textContent=index===order.length-1?'See results →':'Next question →'}else{index++;if(index>=order.length){show('result');el('finalScore').textContent=points+' / '+order.length;el('message').textContent=points>=13?'Amazing cloud knowledge!':points>=10?'Great work! Review the tricky ones and try again.':'Good practice! Try again to improve your score.'}else render()}}</script></body></html>
