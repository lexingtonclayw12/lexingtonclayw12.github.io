<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amara — Canva Prompt</title><meta name="robots" content="noindex"><style>
*{box-sizing:border-box}body{margin:0;background:#101525;color:#f4f2ee;font:17px/1.65 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:64px 24px}.eyebrow{color:#dec590;text-transform:uppercase;letter-spacing:.18em;font-size:12px}h1{font:clamp(36px,7vw,60px)/1.1 Georgia,serif;margin:18px 0}p{color:#bbc2d6}textarea{width:100%;min-height:470px;resize:vertical;background:#192137;color:#f4f2ee;border:1px solid #46516b;border-radius:16px;padding:22px;font:16px/1.7 system-ui,sans-serif}textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #dec590;outline-offset:4px}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin:24px 0}button,a{font:inherit}button{background:#e1c793;color:#151a29;border:0;border-radius:10px;padding:14px 24px;cursor:pointer;font-weight:700}a{color:#e1c793}#status{min-height:28px;color:#dec590;font-size:14px}</style></head>
<body><main><div class="eyebrow">Character creation • Canva image prompt</div><h1>Amara, Daughter<br>of Morpheus</h1><p>Copy the prompt below, then paste it into Canva’s AI image generator.</p><label for="prompt">Your image prompt</label><textarea id="prompt" readonly>Create a hyperrealistic cinematic portrait of Amara, an African American demigoddess and daughter of Morpheus, the Greek god of dreams. She is an adult woman with deep brown skin, realistic skin texture, striking brown eyes with a subtle violet glow, and long black braids decorated with antique gold cuffs. Her expression is calm, confident, and powerful.

She wears an elegant midnight-blue Greek gown, intricately engraved gold armor featuring poppies and wing motifs, and a flowing indigo cloak. She stands in a ruined Greek marble temple floating above moonlit clouds.

Show her powers: golden dream threads flowing between her fingers as she weaves lifelike illusions, a glowing doorway into the dream realm behind her, and a protective raven formed from shadow and starlight beside her shoulder.

Use dramatic moonlight, soft golden reflections on her skin, atmospheric mist, realistic fabric and metal, and shallow depth of field. Make it look like a photograph from a high-budget fantasy film. Vertical 2:3 composition, three-quarter-length portrait, anatomically accurate hands. No text, logos, cartoon styling, or plastic-looking skin.</textarea><div class="actions"><button id="copy" type="button">Copy Canva prompt</button><a href="https://www.canva.com/" target="_blank" rel="noopener noreferrer">Open Canva ↗</a></div><div id="status" role="status" aria-live="polite"></div></main><script>
const field=document.getElementById('prompt'),status=document.getElementById('status');
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(field.value);status.textContent='Copied! Paste it into Canva’s image generator.';}catch(e){field.focus();field.select();field.setSelectionRange(0,field.value.length);let copied=false;try{copied=document.execCommand('copy')}catch(e){}status.textContent=copied?'Copied! Paste it into Canva.':'Prompt selected. Press and hold to copy, or use Ctrl+C / Command+C.';}});
</script></body></html>
